name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: "Manifest URL"
        required: true
        default: "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp"

      MANIFEST_BRANCH:
        description: "Manifest Branch"
        required: true
        default: "twrp-11"

      DEVICE_TREE_URL:
        description: "Device Tree URL"
        required: true
        default: "https://github.com/AradhayPlayChannel/twrp_device_tecno_kg5"

      DEVICE_TREE_BRANCH:
        description: "Device Tree Branch"
        required: true
        default: "kg5-bringup"

      DEVICE_PATH:
        description: "Device Path"
        required: true
        default: "device/tecno/kg5"

      DEVICE_NAME:
        description: "Device Name"
        required: true
        default: "kg5"

      MAKEFILE_NAME:
        description: "Lunch Target"
        required: true
        default: "twrp_kg5"

      BUILD_TARGET:
        description: "Build Target"
        required: true
        default: "boot"

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Display Run Parameters
        run: |
          echo "::group::Build Parameters"
          echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
          echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
          echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
          echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
          echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}"
          echo "::endgroup::"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cleanup Runner
        uses: rokibhasansagar/slimhub_actions@main

      - name: Prepare Environment
        run: |
          sudo apt update
          sudo apt -y upgrade
          sudo apt install -y \
            gperf gcc-multilib gcc-10-multilib \
            g++-multilib g++-10-multilib \
            libc6-dev lib32ncurses5-dev \
            x11proto-core-dev libx11-dev \
            tree lib32z-dev libgl1-mesa-dev \
            libxml2-utils xsltproc bc ccache \
            lib32readline-dev lib32z1-dev \
            liblz4-tool libncurses5-dev \
            libsdl1.2-dev libxml2 lzop \
            pngcrush schedtool squashfs-tools \
            imagemagick libbz2-dev lzma \
            ncftp qemu-user-static \
            libstdc++-10-dev python3

      - name: Install OpenJDK 8
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize Repo
        id: workspace
        run: |
          mkdir workspace
          cd workspace

          git config --global user.name "AradhayPlayChannel"
          git config --global user.email "dimondada1912@gmail.com"

          repo init --depth=1 \
            -u "${{ github.event.inputs.MANIFEST_URL }}" \
            -b "${{ github.event.inputs.MANIFEST_BRANCH }}"

          echo "workspace=$(pwd)" >> $GITHUB_OUTPUT

      - name: Repo Sync
        working-directory: workspace
        run: |
          repo sync -j$(nproc) --force-sync

      - name: Clone Device Tree
        working-directory: ${{ steps.workspace.outputs.workspace }}
        run: |
          git clone \
            -b "${{ github.event.inputs.DEVICE_TREE_BRANCH }}" \
            "${{ github.event.inputs.DEVICE_TREE_URL }}" \
            "${{ github.event.inputs.DEVICE_PATH }}"

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Build Recovery
        working-directory: ${{ steps.workspace.outputs.workspace }}
        run: |
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true

          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng

          make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc)

          echo "Build Finished Successfully"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.run_id }}
          name: "TWRP Recovery for TECNO KG5 (Run ${{ github.run_id }})"
          body: |
            Device: TECNO KG5
            Manifest: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Build Target: ${{ github.event.inputs.BUILD_TARGET }}.img

          files: |
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}